[book]
title = "franka-rs"
description = "A pure-Rust client for the Franka Control Interface (FCI v10 / FR3 and FCI v5 / FER)."
authors = ["Baris Yazici"]
language = "en"
src = "src"

[build]
# Out of the source tree, so a local `mdbook build` leaves nothing untracked behind:
# /target is already gitignored.
build-dir = "../../target/book"
create-missing = false

[output.html]
# The light theme is restyled in theme/guide.css to match the landing page; the dark
# themes keep mdBook's palettes, with ayu (the automatic dark choice) warmed to match.
default-theme = "light"
preferred-dark-theme = "ayu"
additional-css = ["theme/guide.css"]
# Collapsible sidebar groups. Without it every group is open; nothing else depends on it.
additional-js = ["theme/guide.js"]
git-repository-url = "https://github.com/BarisYazici/franka-rs"
edit-url-template = "https://github.com/BarisYazici/franka-rs/edit/main/docs/book/{path}"
# Part titles carry the structure; running chapter numbers across the parts would not.
no-section-label = true
sidebar-header-nav = false

# Nested chapters (the Raspberry Pi steps) start folded; the one you are on opens.
[output.html.fold]
enable = true
level = 0

# The 0.2.0 book was a flat list of pages; links to those names exist in the wild (README,
# changelog, crates.io). Keep them working.
[output.html.redirect]
"/getting-started.html" = "getting-started/install.html"
"/controlling-the-robot.html" = "howto/target-control.html"
"/robot-state-and-errors.html" = "concepts/state-and-errors.html"
"/flight-recorder.html" = "howto/flight-recorder.html"
"/model.html" = "howto/model.html"
"/gripper.html" = "howto/gripper.html"
"/python.html" = "getting-started/python.html"
"/fer.html" = "reference/fer.html"
"/testing-with-franka-sim.html" = "howto/simulator-tests.html"
"/benchmarks.html" = "reference/benchmarks.html"
