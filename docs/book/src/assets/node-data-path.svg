<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 990" role="img" aria-labelledby="title desc">
  <title id="title">How franka-node turns remote targets into robot motion</title>
  <desc id="desc">A client sends targets over Zenoh to a bounded queue of 64 targets. One arm thread checks ownership, targets, session state and watchdogs, then passes accepted targets to the local franka-rs realtime control loop. The loop runs at 1 kilohertz and exchanges torques and measured state with the robot through FCI. The arm thread publishes state back over Zenoh at 100 hertz by default. Episode events mark session starts and ends; node status is published once per second.</desc>
  <defs>
    <marker id="command" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#266b62"/></marker>
    <marker id="feedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#285f89"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202d38; }
    .heading { font-size: 27px; font-weight: 700; }
    .label { font-size: 22px; font-weight: 650; }
    .body { font-size: 19px; }
    .small { font-size: 18px; }
    .command { fill: none; stroke: #266b62; stroke-width: 3; marker-end: url(#command); }
    .feedback { fill: none; stroke: #285f89; stroke-width: 3; stroke-dasharray: 7 5; marker-end: url(#feedback); }
    .green { fill: #266b62; }
    .blue { fill: #285f89; }
  </style>
  <rect width="760" height="990" rx="20" fill="#f6f5f1"/>
  <text x="380" y="46" text-anchor="middle" class="heading">From a network target to robot motion</text>
  <path d="M175 77H218" class="command"/><text x="230" y="83" class="small green">Commands</text>
  <path d="M413 77H456" class="feedback"/><text x="468" y="83" class="small blue">Feedback</text>

  <rect x="140" y="114" width="480" height="82" rx="12" fill="#fff" stroke="#88959e"/>
  <text x="380" y="148" text-anchor="middle" class="label">Client over Zenoh</text>
  <text x="380" y="177" text-anchor="middle" class="body">Python or any other Zenoh client</text>

  <rect x="82" y="235" width="596" height="427" rx="16" fill="#eaf1ed" stroke="#8dab9f"/>
  <text x="106" y="269" class="label green">franka-node · Pi or realtime Linux PC</text>

  <rect x="140" y="293" width="480" height="66" rx="10" fill="#fff" stroke="#8dab9f"/>
  <text x="380" y="322" text-anchor="middle" class="label">Target queue</text>
  <text x="380" y="347" text-anchor="middle" class="body">At most 64 targets in flight</text>
  <path d="M620 154H651V326H620" class="command"/>
  <text x="666" y="218" class="small green" text-anchor="middle" transform="rotate(90 666 218)">Targets</text>

  <rect x="140" y="398" width="480" height="90" rx="10" fill="#fff" stroke="#8dab9f"/>
  <text x="380" y="431" text-anchor="middle" class="label">One arm thread per robot</text>
  <text x="380" y="463" text-anchor="middle" class="body">Target checks · ownership · watchdogs</text>
  <path d="M380 359V398" class="command"/>

  <rect x="140" y="554" width="480" height="84" rx="10" fill="#d8e9e1" stroke="#266b62" stroke-width="2"/>
  <text x="380" y="587" text-anchor="middle" class="label">franka-rs · local 1 kHz control loop</text>
  <text x="380" y="618" text-anchor="middle" class="body">Trajectory generation + torque control</text>
  <path d="M242 488V554" class="command"/>
  <text x="255" y="524" class="small green">Target</text>
  <path d="M480 554V488" class="feedback"/>
  <text x="495" y="524" class="small blue">State</text>

  <path d="M140 444H48V154H140" class="feedback"/>
  <text x="27" y="374" text-anchor="middle" transform="rotate(-90 27 374)" class="small blue">State back to the client</text>

  <rect x="140" y="769" width="480" height="80" rx="12" fill="#fff" stroke="#88959e"/>
  <text x="380" y="802" text-anchor="middle" class="label">Robot or franka-sim</text>
  <text x="380" y="831" text-anchor="middle" class="small">FCI · wired Ethernet for a physical robot</text>
  <path d="M242 638V769" class="command"/>
  <text x="140" y="704" class="small green">Torques</text>
  <path d="M480 769V638" class="feedback"/>
  <text x="495" y="698" class="small blue">Measured</text>
  <text x="495" y="723" class="small blue">state</text>

  <path d="M105 878H655" stroke="#c3cbc8"/>
  <text x="380" y="909" text-anchor="middle" class="body">State: 100 Hz by default while controlling</text>
  <text x="380" y="941" text-anchor="middle" class="body">Episode events: session start / end · Node status: 1 Hz</text>
  <text x="380" y="972" text-anchor="middle" class="small">Zenoh stays outside the realtime control loop.</text>
</svg>
