<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-labelledby="title desc">
  <title id="title">From your program to robot motion</title>
  <desc id="desc">Your program chooses a goal and sends it to a Pi 5 or Linux PC. There, franka-rs turns the goal into smooth motion for the Franka robot. The robot moves and reports its state.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#38796f"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; fill: #202b37; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 25px; }
      .label { font-size: 24px; font-weight: 600; fill: #2e655c; }
      .connection { fill: none; stroke: #38796f; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="480" height="720" rx="22" fill="#f7f6f2"/>

  <rect x="28" y="24" width="424" height="166" rx="18" fill="#fff" stroke="#c7cfcd" stroke-width="1.5"/>
  <text x="240" y="90" class="heading">Your program</text>
  <text x="240" y="138" class="body">Choose a goal</text>

  <path d="M240 206V254" class="connection"/>
  <text x="294" y="238" class="label">Goal</text>

  <rect x="28" y="270" width="424" height="184" rx="18" fill="#edf5f1" stroke="#94b5aa" stroke-width="1.5"/>
  <text x="240" y="326" class="heading">Pi 5 or Linux PC</text>
  <text x="240" y="377" class="body">franka-rs turns it into</text>
  <text x="240" y="411" class="body">smooth motion</text>

  <path d="M240 470V520" class="connection"/>
  <text x="306" y="503" class="label">Motion</text>

  <rect x="28" y="536" width="424" height="160" rx="18" fill="#fff" stroke="#c7cfcd" stroke-width="1.5"/>
  <text x="240" y="588" class="heading">Franka robot</text>
  <text x="240" y="636" class="body">Moves and reports</text>
  <text x="240" y="670" class="body">its state</text>
</svg>
