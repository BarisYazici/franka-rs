name: Online notebook

on:
  push:
    branches: [main]
    paths:
      - '.binder/**'
      - '.github/workflows/notebook.yml'
      - 'crates/franka-py/**'
      - 'crates/franka-rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.binder/**'
      - '.github/workflows/notebook.yml'
      - 'crates/franka-py/**'
      - 'crates/franka-rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRANKA_REALTIME: ignore
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            .binder/requirements.txt
            .binder/simulator-requirements.txt
      - uses: Swatinem/rust-cache@v2
      - name: Install headless simulator system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglfw3
      - name: Install notebook dependencies
        run: python -m pip install -r .binder/requirements.txt
      - name: Build native bindings and prepare simulator
        run: bash .binder/postBuild
      - name: Check simulator process lifecycle
        run: python -m unittest discover -s crates/franka-py/examples -p test_sim_runtime.py -v
      - name: Execute notebook Run All against the simulator
        run: |
          python .binder/verify_notebook.py
          python .binder/verify_notebook.py quickstart.ipynb
