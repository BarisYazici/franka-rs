name: Release

# On a `v*` tag: the Python wheels (x86_64 and aarch64 manylinux, plus the sdist) to PyPI
# through trusted publishing and `franka-rs` to crates.io. From the Actions tab
# (`workflow_dispatch`) the wheels are built and the crate publish is a `--dry-run`; nothing
# is uploaded.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `abi3-py39` in crates/franka-py: one wheel per target covers every Python from 3.9.
  # The action builds in its manylinux containers, aarch64 cross-compiled in the
  # `rust-cross` image (no QEMU); the host's Python does not enter a containerised build.
  wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/franka-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/franka-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Trusted publishing: PyPI accepts the job's OIDC token for the `pypi` environment of
  # this repository and workflow (docs/book/src/contributing.md, "Releasing").
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # crates.io trusted publishing: a short-lived token from the workflow's identity.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p franka-rs ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
