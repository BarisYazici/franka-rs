name: CI

# The FR3 simulator jobs below (`sim-nominal`, `sim-motion-limits`, `sim-gripper-object`) pull
# the published `ghcr.io/barisyazici/franka-sim` image via the `BarisYazici/libfranka-sim@v1`
# action (its `image`/`tag` inputs default to `ghcr.io/barisyazici/franka-sim:latest`).
#
# There is no published image for the FER / FCI v5 simulator, so `sim-fer-v5` cannot use that
# action's default and is gated on the `FRANKA_SIM_FER_IMAGE` repository variable (Settings ->
# Secrets and variables -> Actions -> Variables): unset, the job is skipped; set to a
# `docker pull`-able reference, the job builds and runs the FCI v5 simulator suite against it.
# Without that variable the FCI v5 protocol suite runs offline in the `check` job only (wire
# layout and model conformance, no simulator).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints and every test that needs neither Docker nor the network: the crate's
  # own unit tests, plus the two `franka-rs` integration
  # test binaries per FCI version that only assert wire layout, plus the model conformance
  # suites (`wire_sizes.rs` / `wire_sizes_v5.rs`, `model_conformance.rs` /
  # `fer_native_conformance.rs` / `fer_model_conformance.rs`), plus
  # `example_motion_generator.rs`, which pins the examples' shared `MotionGenerator` against a
  # regression a simulator cannot reproduce.
  #
  # `fer_native_conformance.rs` checks the built-in FER model against a committed JSON
  # fixture dumped from a real FER's `libfcimodels_x64.so`, so it runs for real in CI.
  #
  # `fer_model_conformance.rs` drives that shared object itself, which is not committed and
  # not published, so in CI it has nothing to load. It does not fail: every test prints a
  # `SKIP:` line straight to the process's stderr (past libtest's output capture) and
  # returns, and `model_library_fixture_present_or_skipped_loudly` makes that visible in one
  # place. Set `FRANKA_FER_MODEL_SO` to a captured library to run it for real. It is in this
  # job with `--features model-library` so that it keeps compiling and so that the skip
  # is on the record.
  #
  # Everything else under crates/franka-rs/tests/ is a `sim_*.rs` binary that connects to a
  # running franka-sim server; those run in the three simulator jobs below instead. This job
  # also does not run franka-sim-test's own `tests/harness.rs`, and no job in this workflow
  # does: that file tests the container harness itself -- it starts and tears down a real,
  # network-pulled franka-sim container and asserts on `docker ps` -- so it cannot run against
  # the already-running server the simulator jobs attach to, and does not belong in a fast,
  # offline check job. It is run locally instead:
  # `FRANKA_SIM_IMAGE=franka-sim:dev cargo test -p franka-sim-test --test harness`
  # (docs/book/src/contributing.md, "The simulator lock").
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (--no-default-features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      # `-p franka-rs` alone: with `--workspace` fer-model-fit's explicit opt-in unifies
      # `model-library` back on, even though franka-rs disables it by default.
      - name: cargo clippy (franka-rs, --no-default-features)
        run: cargo clippy -p franka-rs --all-targets --no-default-features -- -D warnings

      - name: cargo clippy (franka-rs, --features serde)
        run: cargo clippy -p franka-rs --all-targets --features serde -- -D warnings

      - name: cargo clippy (franka-rs, --features model-library)
        run: cargo clippy -p franka-rs --all-targets --features model-library -- -D warnings

      # The node's episode recording pulls franka-rerun; off by default. The camera crate's
      # integration test is gated on its `fake` source, so --all-targets alone never builds it.
      - name: cargo clippy (franka-node, --features record)
        run: cargo clippy -p franka-node --all-targets --features record -- -D warnings

      - name: cargo clippy (franka-cam, --all-features)
        run: cargo clippy -p franka-cam --all-targets --all-features -- -D warnings

      - name: unit tests
        run: cargo test --workspace --lib

      - name: unit tests (franka-rs, --features serde)
        run: cargo test -p franka-rs --lib --features serde

      - name: unit tests (franka-rs, --features model-library)
        run: cargo test -p franka-rs --lib --features model-library

      - name: wire_sizes + model_conformance (FCI v10 and v5)
        run: |
          cargo test -p franka-rs \
            --test wire_sizes --test model_conformance \
            --test wire_sizes_v5 --test fer_native_conformance \
            --test example_motion_generator

      - name: FER model-library conformance (opt-in)
        run: cargo test -p franka-rs --features model-library --test fer_model_conformance

      - name: doctests
        run: cargo test --workspace --doc

      - name: doctests (franka-rs, default features)
        run: cargo test -p franka-rs --doc

      # The flight recorder on synthetic logs, plus the recorder's 1 kHz producer test.
      - name: franka-rerun tests and example build
        run: |
          cargo test -p franka-rerun
          cargo build -p franka-rerun --examples

      # The node's recording against its fake robot (a real recorder into a temp dir).
      - name: unit tests (franka-node, --features record)
        run: cargo test -p franka-node --lib --features record

      # The camera crate's config accepts record_dir only with the feature; the node test needs
      # the fake source and no camera, on the loopback.
      - name: unit tests (franka-cam, --features record)
        run: cargo test -p franka-cam --lib --features record

      # `fake` builds the test's camera, `record` its recording half.
      - name: camera node in process (franka-cam, --features fake,record)
        run: cargo test -p franka-cam --features fake,record --test cam_node

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: cargo doc (franka-rs, default features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p franka-rs --no-deps

  # Build-only: confirms the crate and its examples cross-compile for aarch64
  # (aarch64-unknown-linux-gnu). Uses the distro cross-gcc as the
  # linker rather than cargo-zigbuild, since ubuntu-latest already has apt/root and this keeps
  # the job to a single `apt install` with no extra toolchain to fetch.
  aarch64-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 cross-gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # franka-cam is built here too: it hand-rolls the V4L2 ioctl numbers from the struct
      # sizes and refuses to compile off LP64, and the Raspberry Pi it runs on is this target.
      - name: cargo build --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu -p franka-rs --examples
          cargo build --release --target aarch64-unknown-linux-gnu -p franka-cam --bin franka-cam

  # A franka-sim server with the default configuration (no motion-limit or communication-
  # constraint enforcement, gripper enabled, no object between the fingers). `FRANKA_SIM_ADDR`
  # makes crates/franka-sim-test's harness attach to this job's already-running server on
  # 127.0.0.1 instead of starting its own Docker container; in that mode the `SimConfig` each
  # test builds is informational only; --skip drops the one sim_gripper test that needs an
  # object between the fingers, which this server does not have (see the sim-gripper-object job).
  #
  # Every simulator job builds with --release. The control loops under test must answer the
  # server's 1 kHz state stream in time: unoptimised, the impedance loop of target control
  # takes about a millisecond per cycle (35 us optimised) and, sharing a runner with the
  # simulator, falls behind until the server's continuity checks abort the motion.
  sim-nominal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: BarisYazici/libfranka-sim@v1

      - name: Simulator tests (nominal configuration)
        env:
          FRANKA_SIM_ADDR: 127.0.0.1
        run: |
          cargo test --release -p franka-rs \
            --test sim_handshake --test sim_commands --test sim_motions --test sim_gripper \
            -- --test-threads=1 --skip grasp_with_object_between_the_fingers

      # The README's joint move must actually run in GitHub Actions against the simulator. It
      # takes the hostname from argv and RealtimeConfig from FRANKA_REALTIME, so the same
      # binary runs here and against real hardware. Last in this job, because it moves the arm
      # and (unlike the tests above) does not restore the start pose afterwards.
      - name: README example (readme_joint_move)
        env:
          FRANKA_REALTIME: ignore
        run: cargo run --release -p franka-rs --example readme_joint_move -- 127.0.0.1

  # A franka-sim server with --enforce-motion-limits, exercising the reflex/recovery and rate-
  # limiting envelope tests in sim_stop_and_reflex.rs, and the target control loops of
  # sim_target_control.rs (a low-rate commander bridged by the crate's own thread), which are
  # only meaningful with the limits enforced.
  #
  # Every test in those files homes the arm with `common::move_to_start` before it moves, so
  # each binary runs as one invocation against this job's single long-lived server, in any
  # order (libtest runs a file's tests in alphabetical order; the tests do not depend on it).
  sim-motion-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: BarisYazici/libfranka-sim@v1
        with:
          args: --enforce-motion-limits

      - name: Simulator tests (motion limits enforced)
        env:
          FRANKA_SIM_ADDR: 127.0.0.1
        run: |
          cargo test --release -p franka-rs --test sim_stop_and_reflex --test sim_target_control \
            -- --test-threads=1

      # The Zenoh node (crates/franka-node) in process against the same server: its target
      # control needs franka-sim >= 1.1.6 like sim_target_control above. With `record` every
      # session is also written as an `.rrd` and checked.
      - name: Simulator test (franka-node, --features record)
        env:
          FRANKA_SIM_ADDR: 127.0.0.1
        run: |
          cargo test --release -p franka-node --features record --test sim_node \
            -- --test-threads=1

      # The Python client (crates/franka-node/python) against the node binary and the same
      # server: its offline tests, then tests/test_sim_node.py (target/release/franka-node).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python client (franka-node-client)
        env:
          FRANKA_SIM_ADDR: 127.0.0.1
        run: |
          cargo build --release -p franka-node --features record --bin franka-node
          pip install ./crates/franka-node/python pytest
          pytest crates/franka-node/python/tests -v

  # The Python bindings (crates/franka-py) against the same --enforce-motion-limits server:
  # maturin builds the wheel, pip installs it, and pytest drives the target loops from Python
  # (crates/franka-py/tests/test_sim.py, FRANKA_SIM_ADDR attaching as above).
  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: BarisYazici/libfranka-sim@v1
        with:
          args: --enforce-motion-limits

      - name: Build and install the wheel
        run: |
          pip install maturin numpy pytest
          maturin build --release --manifest-path crates/franka-py/Cargo.toml --out dist
          pip install dist/*.whl

      - name: pytest against the simulator
        env:
          FRANKA_SIM_ADDR: 127.0.0.1
          FRANKA_REALTIME: ignore
        run: pytest crates/franka-py/tests -v

  # A franka-sim server with a graspable object placed between the gripper's fingers, for the
  # one sim_gripper test that the nominal job above deliberately skips.
  sim-gripper-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: BarisYazici/libfranka-sim@v1
        with:
          args: --gripper-object-width 0.04

      - name: Simulator test (grasp with an object)
        env:
          FRANKA_SIM_ADDR: 127.0.0.1
        run: |
          cargo test --release -p franka-rs --test sim_gripper grasp_with_object_between_the_fingers \
            -- --test-threads=1

  # The FER / FCI v5 simulator suite. Unlike the FR3 jobs above, this does not use the
  # BarisYazici/libfranka-sim action (there is no published image for it to pull, and the
  # FER image also lacks the `franka-sim-check` binary that action's readiness probe needs;
  # see docs/book/src/reference/fer.md). Instead the franka-sim-test harness starts and stops the container
  # itself -- the same path used locally -- driven entirely by FRANKA_SIM_FER_IMAGE.
  #
  # Skipped entirely when the FRANKA_SIM_FER_IMAGE repository variable is unset, so this
  # workflow stays green with no FER image published (see the file header).
  sim-fer-v5:
    runs-on: ubuntu-latest
    if: ${{ vars.FRANKA_SIM_FER_IMAGE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Simulator tests (FER / FCI v5, native and model-library)
        env:
          FRANKA_SIM_FER_IMAGE: ${{ vars.FRANKA_SIM_FER_IMAGE }}
        run: |
          cargo test --release -p franka-rs --features model-library \
            --test sim_v5_handshake --test sim_v5_commands --test sim_v5_motions \
            --test sim_v5_stop_and_reflex -- --test-threads=1
