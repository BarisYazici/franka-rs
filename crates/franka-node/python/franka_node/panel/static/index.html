<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>franka tuning</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#14161a; --panel:#1d2026; --line:#2c3038; --fg:#e6e6e6; --dim:#8a919c; --accent:#5aa9ff;
  --ok:#4fc37a; --warn:#e0a52a; --bad:#e5564f; --edit:#c88cff; font-size:13px; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
header { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--line); padding:6px 12px; }
header.reflex { background:#4a1d1d; } header.offline { background:#333; color:var(--dim); }
header.blind #channels { color:var(--bad); }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.grow { flex:1; }
button { background:#2a2f38; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 10px; cursor:pointer; font:inherit; }
button:disabled { opacity:.45; cursor:default; }
button.primary { background:var(--accent); color:#000; border-color:var(--accent); }
button.danger { background:var(--bad); color:#fff; border-color:var(--bad); }
select, input[type=text] { background:#2a2f38; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 6px; font:inherit; }
.bar { padding:4px 8px; border-radius:4px; margin-top:4px; display:none; }
.bar.show { display:block; }
.bar.amber { background:#4a3a10; color:#ffd36a; } .bar.red { background:#4a1d1d; color:#ffb1ad; } .bar.grey { background:#2a2f38; color:var(--dim); }
main { padding:8px 12px; display:grid; gap:8px; }
section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
section.unreachable { opacity:.5; }
section.locked .param { opacity:.6; }
section h2 { margin:0 0 4px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; display:flex; gap:10px; align-items:center; }
section h2 .grow { flex:1; }
.param { display:grid; grid-template-columns:200px 1fr; gap:4px 10px; align-items:center; padding:3px 0; border-top:1px solid #23272e; }
.param .name { color:var(--fg); }
.param .name .unit { color:var(--dim); margin-left:4px; }
.param .name .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--edit); margin-left:6px; visibility:hidden; }
.param.edited .name .dot { visibility:visible; }
.ctl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.ctl input[type=range] { flex:1; min-width:140px; max-width:360px; accent-color:var(--accent); }
.ctl input[type=number] { width:88px; background:#2a2f38; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:2px 4px; font:inherit; }
.ctl input.flash { animation:flash 1.2s; } @keyframes flash { from { background:#7a5a10; } to { background:#2a2f38; } }
.ctl .axis { color:var(--dim); width:16px; text-align:right; }
.ctl .hint { color:var(--dim); }
.ctl .slew { color:var(--accent); font-size:11px; }
.err { grid-column:2; color:var(--bad); }
.adv { grid-column:1 / span 2; padding:3px 6px; border-radius:3px; background:#2a2f38; color:var(--warn); }
.adv.bad { background:#4a1d1d; color:#ffb1ad; }
.adv.ok { color:var(--dim); }
.adv.info { background:none; color:var(--fg); }
.derived { color:var(--dim); display:flex; gap:14px; flex-wrap:wrap; }
.derived b { color:var(--fg); font-weight:normal; }
#live.stale .val, #live.stale canvas, #live.stale .ba, #live.stale .sub { opacity:.3; }
#live { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:8px; }
.metric { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:center; }
.metric .val { font-size:18px; }
.metric .sub { color:var(--dim); grid-column:1 / span 2; }
.metric canvas { width:100%; height:40px; grid-column:1 / span 2; }
.ba { grid-column:1 / span 2; display:flex; gap:8px; align-items:baseline; }
.ba .better { color:var(--ok); } .ba .worse { color:var(--bad); } .ba .same { color:var(--dim); }
.head { grid-column:1 / span 2; color:var(--dim); }
.caveat { color:var(--dim); font-size:11px; }
table.diff { border-collapse:collapse; } table.diff td { padding:1px 8px; border-top:1px solid var(--line); }
table.diff td.changed { color:var(--warn); }
#presetbox { display:none; margin-top:4px; } #presetbox.show { display:block; }
</style>
</head>
<body>
<header id="header">
  <div class="row">
    <b id="title">franka · connecting</b>
    <span id="versions" class="caveat"></span>
    <span class="grow"></span>
    <span id="channels" class="caveat"></span>
    <span id="phase" class="caveat">waiting for the node</span>
  </div>
  <div class="row" style="margin-top:4px">
    <button id="load">Load current</button>
    <button id="apply" class="primary" disabled>Apply</button>
    <button id="revert" disabled>Revert to loaded</button>
    <select id="presets"><option value="">Preset…</option></select>
    <button id="recall" disabled>Recall</button>
    <button id="compare" disabled>Compare</button>
    <button id="savepreset">Save as preset</button>
    <span class="grow"></span>
    <select id="arms"></select>
  </div>
  <div id="presetbox" class="row">
    <input id="pname" type="text" placeholder="preset name">
    <input id="pnote" type="text" placeholder="note" style="width:320px">
    <button id="psave">save</button><button id="pcancel">cancel</button>
  </div>
  <div id="stalebar" class="bar amber"></div>
  <div id="confirmbar" class="bar red"></div>
  <div id="restartbar" class="bar grey"></div>
  <div id="errbar" class="bar red"></div>
</header>
<main>
  <section>
    <h2>live <span class="grow"></span><span id="livecaveat" class="caveat">j4 from the 100 Hz state stream, not the 1 kHz loop · lag against the accepted target, not the hand</span>
      <button id="marker">drop marker</button><button id="clearmarkers">clear markers</button></h2>
    <div id="live"></div>
  </section>
  <div id="groups"></div>
  <section id="compareout" style="display:none"><h2>compare <span class="grow"></span><button id="closecompare">close</button></h2><div id="comparebody"></div></section>
</main>
<script src="/static/api.js"></script>
<script src="/static/controls.js"></script>
<script src="/static/advisories.js"></script>
<script src="/static/requests.js"></script>
<script src="/static/live.js"></script>
<script src="/static/panel.js"></script>
</body>
</html>
