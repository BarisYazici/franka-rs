# Standalone crate: the empty `[workspace]` table below keeps it out of the repository's
# root workspace (`/Cargo.toml`), so the workspace and its Cargo.lock stay untouched.
[workspace]

[package]
name = "franka-model-micro"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[[bin]]
name = "model_micro_rust"
path = "src/main.rs"

[dependencies]
franka-rs = { path = "../../../crates/franka-rs" }
libc = "0.2"
serde_json = "1"

[profile.release]
# Explicit so the C++ and Rust binaries are demonstrably built the same way: both are
# optimised at level 3 (`-O3` for C++). `debug` only adds symbols, it does not change codegen.
opt-level = 3
debug = true
