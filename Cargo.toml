[workspace]
resolver = "2"
members = [
    "crates/franka-rs",
    "crates/franka-rerun",
    "crates/franka-sim-test",
    "crates/franka-py",
    "tools/fer-model-fit",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/BarisYazici/franka-rs"
homepage = "https://barisyazici.github.io/franka-rs/"

[workspace.dependencies]
nalgebra = "0.35"
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }
libc = "0.2"
urdf-rs = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
